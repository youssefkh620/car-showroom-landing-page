<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>car-showroom</title>

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="./dist/output.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script
      src="https://kit.fontawesome.com/9acf570851.js"
      crossorigin="anonymous"
    ></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav
      id="navBg"
      class="flex items-center justify-between py-2 px-4 md:px-8 lg:px-32 fixed w-full ease-in-out duration-300 rounded-b-xl"
    >
      <div id="logo" class="flex items-center gap-2">
        <img src="images/logo.svg" alt="" />
        <h2 class="font-heading font-black text-[18px] text-[#E7000B]">
          <span class="text-indigo-700">APEX </span>MOTORS
        </h2>
      </div>
      <div class="lg:flex items-center justify-between hidden gap-4 ml-auto">
        <ul
          id="navList"
          class="font-semibold text-xs font-primary flex items-center justify-between gap-4"
        >
          <li
            class="hover:text-[#E7000B] hover:cursor-pointer ease-in-out duration-300"
          >
            HOME
          </li>
          <li
            class="hover:text-[#E7000B] hover:cursor-pointer ease-in-out duration-300"
          >
            CARS
          </li>
          <li
            class="hover:text-[#E7000B] hover:cursor-pointer ease-in-out duration-300"
          >
            ABOUT
          </li>
          <li
            class="hover:text-[#E7000B] hover:cursor-pointer ease-in-out duration-300"
          >
            CONTACT
          </li>
        </ul>
        <button
          class="font-primary font-semibold text-[#E7000B] border-2 rounded-4xl py-2 px-5 hover:cursor-pointer hover:text-white hover:bg-[#E7000B] ease-in duration-300"
        >
          Login
        </button>
      </div>
      <div id="menuDiv">
        <button id="menuBtn" class="lg:hidden relative hover:cursor-pointer">
          <i class="fa-solid fa-bars-staggered"></i>
        </button>

        <ul
          id="menu"
          class="absolute w-full right-0 top-12 rounded-2xl p-4 bg-white shadow-lg border border-gray-100 lg:hidden font-semibold text-xs font-primary text-[#364153] flex flex-col items-start justify-between gap-4"
        >
          <li
            class="hover:text-[#E7000B] hover:cursor-pointer ease-in-out duration-300"
          >
            HOME
          </li>
          <li
            class="hover:text-[#E7000B] hover:cursor-pointer ease-in-out duration-300"
          >
            CARS
          </li>
          <li
            class="hover:text-[#E7000B] hover:cursor-pointer ease-in-out duration-300"
          >
            ABOUT
          </li>
          <li
            class="hover:text-[#E7000B] hover:cursor-pointer ease-in-out duration-300"
          >
            CONTACT
          </li>
          <button
            class="lg:hidden font-primary w-full font-semibold text-[#E7000B] border-2 rounded-4xl py-2 px-5 hover:cursor-pointer hover:text-white hover:bg-[#E7000B] ease-in duration-300"
          >
            Login
          </button>
        </ul>
      </div>
    </nav>
    <section
      id="hero"
      class="h-screen bg-[url('images/heroImg.svg')] bg-cover bg-center flex flex-col items-start justify-center py-2 px-4 md:px-8 lg:px-32"
    >
      <h1
        class="text-6xl lg:text-7xl font-heading font-black text-[#E7000B] mt-12"
      >
        <span class="text-white">DRIVE THE</span><br />EXTRAORDINARY
      </h1>
      <p class="font-primary text-[#D1D5DC] mt-10 mb-10">
        Curated collection of the world's finest automobiles.<br />
        Your dream car is waiting.
      </p>
      <div class="flex justify-between items-center gap-6 mb-16">
        <button
          class="font-primary font-bold text-white bg-[#E7000B] py-3.5 px-7 rounded-4xl hover:cursor-pointer hover:scale-105 transition-transform duration-300"
        >
          Explore Cars</button
        ><button
          class="border border-[#4F5159] box-border font-primary font-bold text-white py-3.5 px-7 rounded-4xl hover:cursor-pointer hover:scale-105 transition-transform duration-300"
        >
          Book Test Drive
        </button>
      </div>
      <span class="block w-1/3 h-0.5 bg-[#1C202A]"></span>
      <div class="flex items-center justify-between gap-10 mt-8">
        <div>
          <h1 class="font-heading font-black text-2xl text-white">500+</h1>
          <p
            class="font-primary font-medium text-[11px] text-[#99A1AF] tracking-[1.8px]"
          >
            CARS
          </p>
        </div>
        <div>
          <h1 class="font-heading font-black text-2xl text-white">12K++</h1>
          <p
            class="font-primary font-medium text-[11px] text-[#99A1AF] tracking-[1.8px]"
          >
            CUSTOMERS
          </p>
        </div>
        <div>
          <h1 class="font-heading font-black text-2xl text-white">15 Yrs+</h1>
          <p
            class="font-primary font-medium text-[11px] text-[#99A1AF] tracking-[1.8px]"
          >
            EXPERIENCE
          </p>
        </div>
      </div>
    </section>
    <section class="bg-[#F9FAFB] py-20 px-4 md:px-8 lg:px-32">
      <div class="flex items-end justify-between mb-12">
        <div>
          <h5 class="font-primary text-[12px] font-bold text-[#E7000B]">
            Handpicked
          </h5>
          <h1 class="font-heading font-black text-4xl text-[#101828]">
            FEATURED CARS
          </h1>
        </div>
        <button class="font-primary text-[12px] font-bold text-[#E7000B]">
          View All →
        </button>
      </div>
      <div
        id="carsContainer"
        class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-5"
      ></div>
    </section>
    <script src="js/main.js"></script>
  </body>
</html>
